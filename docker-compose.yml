version: '3.9'

services:

  nginx:
    build:
      context: ./docker/nginx
    container_name: starter_nginx
    ports:
      - "8080:80"
    volumes:
      - ./apps/api:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - api
    networks:
      - starter_network

  api:
    build:
      context: ./docker/php
    container_name: starter_api
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - starter_network

  postgres:
    image: postgres:16-alpine
    container_name: starter_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: starter_db
      POSTGRES_USER: starter_user
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter_user -d starter_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starter_network

  redis:
    image: redis:7-alpine
    container_name: starter_redis
    ports:
      - "6379:6379"
    networks:
      - starter_network

volumes:
  postgres_data:

networks:
  starter_network:
    driver: bridge